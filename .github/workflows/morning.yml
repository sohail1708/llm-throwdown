name: Morning fan-out

on:
  schedule:
    # NYSE opens at 13:30 UTC. We want every AI to have one trade in by
    # ~30 min after open. GitHub Actions cron jitter is often 30+ min, so
    # schedule three attempts spaced through the first hour. daily.py
    # has a per-AI "already traded today" guard so the later firings
    # silently skip AIs that already moved.
    - cron: '30 13 * * 1-5'   # 13:30 UTC — at the bell
    - cron: '0 14 * * 1-5'    # 14:00 UTC — 30 min post-open fallback
    - cron: '30 14 * * 1-5'   # 14:30 UTC — 1h post-open last-chance
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run daily fan-out (3 AIs)
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          ALPACA_CHATGPT_KEY:    ${{ secrets.ALPACA_CHATGPT_KEY }}
          ALPACA_CHATGPT_SECRET: ${{ secrets.ALPACA_CHATGPT_SECRET }}
          ALPACA_CLAUDE_KEY:     ${{ secrets.ALPACA_CLAUDE_KEY }}
          ALPACA_CLAUDE_SECRET:  ${{ secrets.ALPACA_CLAUDE_SECRET }}
          ALPACA_GEMINI_KEY:     ${{ secrets.ALPACA_GEMINI_KEY }}
          ALPACA_GEMINI_SECRET:  ${{ secrets.ALPACA_GEMINI_SECRET }}
        run: python daily.py

      - name: Commit decisions
        run: |
          git config user.name  "throwdown-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/decisions.jsonl
          git commit -m "decisions: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push

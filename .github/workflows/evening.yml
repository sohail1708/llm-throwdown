name: EOD snapshot + dashboard

on:
  schedule:
    # NYSE closes at 20:00 UTC. We want the dashboard live within ~1h of
    # close. GitHub Actions cron has notorious jitter (5 min to multiple
    # hours), so we schedule THREE attempts spaced through the hour after
    # close. eod.py is idempotent: it replaces today's rows in nav.jsonl
    # rather than appending, so multiple firings just refresh the same
    # data with the latest prices.
    - cron: '5 20 * * 1-5'    # 20:05 UTC — 5 min post-close (earliest viable)
    - cron: '30 20 * * 1-5'   # 20:30 UTC — original target
    - cron: '0 21 * * 1-5'    # 21:00 UTC — 1h post-close, last-chance fallback
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run EOD snapshot + dashboard
        env:
          ALPACA_CHATGPT_KEY:    ${{ secrets.ALPACA_CHATGPT_KEY }}
          ALPACA_CHATGPT_SECRET: ${{ secrets.ALPACA_CHATGPT_SECRET }}
          ALPACA_CLAUDE_KEY:     ${{ secrets.ALPACA_CLAUDE_KEY }}
          ALPACA_CLAUDE_SECRET:  ${{ secrets.ALPACA_CLAUDE_SECRET }}
          ALPACA_GEMINI_KEY:     ${{ secrets.ALPACA_GEMINI_KEY }}
          ALPACA_GEMINI_SECRET:  ${{ secrets.ALPACA_GEMINI_SECRET }}
        run: python eod.py

      - name: Commit nav + dashboard
        run: |
          git config user.name  "throwdown-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/nav.jsonl docs/index.html docs/data.json
          git commit -m "eod: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
